# Nothing has been deployed by deploy.py yet. Route to the Compose "standalone"
# app container if it is running (docker-compose --profile standalone up -d),
# otherwise the proxy returns 502. `resolve` lets nginx start even when that
# container doesn't exist.
upstream web_backend {
    zone web_backend 64k;
    server rc-web-standalone:8000 resolve;
    keepalive 16;
}
