# -----------------------------------------------------------------------------
# Baseline environment: nginx (the public entry point) + the app at v1.0.0.
#
#   docker-compose up -d          # http://localhost:8080/version -> v1.0.0
#
# Then deploy new versions with the CLI (zero downtime, auto-rollback):
#
#   python deploy.py --deploy v2.0.0
#
# The first deploy takes over traffic from the baseline container and removes
# it. If you run `docker-compose up -d` again later, the baseline container
# comes back but gets no traffic, and the next deploy removes it again.
# -----------------------------------------------------------------------------
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rc-nginx            # deploy.py looks the proxy up by this name
    ports:
      - "${NGINX_PORT:-8080}:80"
    environment:
      # Have the image's entrypoint fill in NGINX_LOCAL_RESOLVERS (the
      # container's DNS server) when rendering templates/*.template.
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      # Proxy rules, rendered to /etc/nginx/conf.d/default.conf at startup.
      - ./nginx/templates:/etc/nginx/templates:ro
      # Directory mount (not a single file) so deploy.py's atomic file swaps are
      # visible inside the container. Holds active.conf = which version is live.
      # Writable only so the startup script below can create active.conf on a
      # fresh checkout (it isn't stored in git).
      - ./nginx/upstream:/etc/nginx/upstream
      # Startup script: creates active.conf from the placeholder if it's missing.
      - ./nginx/init/10-default-upstream.sh:/docker-entrypoint.d/10-default-upstream.sh:ro
    restart: unless-stopped

  # The v1.0.0 baseline. Until the first deploy, nginx routes here (see
  # nginx/upstream/active.placeholder.conf). The labels let deploy.py
  # recognise it as one of its own and replace it on the first deploy.
  web:
    build:
      context: ./app
      args:
        APP_VERSION: v1.0.0
    image: release-coordinator/web:v1.0.0
    container_name: rc-web-baseline     # the name active.placeholder.conf routes to
    environment:
      APP_VERSION: v1.0.0
    labels:
      rc.managed: "true"
      rc.version: v1.0.0
    expose:
      - "8000"
    restart: unless-stopped

networks:
  default:
    # Fixed name so deploy.py can attach app containers to it.
    name: release-coordinator
